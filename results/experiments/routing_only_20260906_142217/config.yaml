# Experiment: Routing + Hybrid Retrieval
# Compares Fact-First Legal Issue Routing against Baseline C (Hybrid RAG) under identical retrieval conditions.
experiment_id: routing_only
display_name: "Routing + Hybrid Retrieval"
description: "Fact-First Legal Issue Routing with Confidence-Aware Soft Prioritization on Dual-Stream Hybrid RAG (Dense + BM25Okapi + RRF)."

# Pipeline Switches (Strictly Isolated)
pipeline:
  use_retrieval: true
  use_dense_retrieval: true
  use_bm25: true
  use_hybrid_fusion: true
  use_reranker: false
  use_fact_routing: true
  use_compatibility_filter: false
  use_claim_repair: false

# Retrieval Parameters (Identical to Baseline C)
retrieval:
  top_k: 5
  initial_k: 20
  embedding_model: "BAAI/bge-small-en-v1.5"
  bm25_k1: 1.5
  bm25_b: 0.75
  fusion_method: "RRF"
  rrf_constant_k: 60
  statute_purity_boost: 0.0

# Fact-First Routing Parameters
routing:
  config_path: "configs/routing_config.yaml"
  high_confidence_boost: 1.35
  medium_confidence_boost: 1.15

# Benchmark & Execution
benchmark:
  file: "evaluation/development/existing_questions.json"
  eval_retrieval_metrics: true
  eval_generation_metrics: false
