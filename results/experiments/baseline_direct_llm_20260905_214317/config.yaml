# Baseline A: Direct LLM (Zero-Retrieval)
experiment_id: baseline_direct_llm
description: "Direct LLM answering without any retrieval, context injection, or grounding."

# Pipeline Switches (Strictly Isolated)
pipeline:
  use_retrieval: false
  use_dense_retrieval: false
  use_bm25: false
  use_hybrid_fusion: false
  use_reranker: false
  use_fact_routing: false
  use_compatibility_filter: false
  use_claim_repair: false

# Retrieval Parameters (Inactive for Direct LLM)
retrieval:
  top_k: 0
  initial_k: 0
  candidate_pool_size: 0

# LLM Generation Parameters
llm:
  model: "google-gemini"
  temperature: 0.0
  max_output_tokens: 1024
  random_seed: 42
  fallback_allowed: true

# Benchmark & Execution
benchmark:
  file: "evaluation/development/existing_questions.json"
  eval_retrieval_metrics: false
  eval_generation_metrics: true
