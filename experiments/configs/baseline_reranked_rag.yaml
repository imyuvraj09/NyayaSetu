# Baseline D: Hybrid RAG + Cross-Encoder Reranking
experiment_id: baseline_reranked_rag
display_name: "Baseline D — Hybrid RAG + Cross-Encoder Reranking"
description: "Two-stage retrieval generating candidate pool via hybrid search (Dense + BM25 + RRF) and reranking via BAAI/bge-reranker-base cross-encoder."

# Pipeline Switches (Strictly Isolated)
pipeline:
  use_retrieval: true
  use_dense_retrieval: true
  use_bm25: true
  use_hybrid_fusion: true
  use_reranker: true
  use_fact_routing: false
  use_compatibility_filter: false
  use_claim_repair: false

# Retrieval Parameters
retrieval:
  top_k: 5
  initial_k: 20
  candidate_pool_size: 20
  embedding_model: "BAAI/bge-small-en-v1.5"
  reranker_model: "BAAI/bge-reranker-base"
  reranker_batch_size: 16
  reranker_score_threshold: 0.0

# LLM Generation Parameters
llm:
  model: "google-gemini"
  temperature: 0.0
  max_output_tokens: 1024
  random_seed: 42
  fallback_allowed: true

# Benchmark & Execution
benchmark:
  file: "evaluation/development/existing_questions.json"
  eval_retrieval_metrics: true
  eval_generation_metrics: true
