# Baseline C: Hybrid RAG (Dense + BM25Okapi with Reciprocal Rank Fusion)
experiment_id: baseline_hybrid_rag
display_name: "Baseline C — Hybrid RAG"
description: "Dual-stream retrieval fusing dense semantic search with lexical BM25Okapi using RRF (k=60)."

# Pipeline Switches (Strictly Isolated)
pipeline:
  use_retrieval: true
  use_dense_retrieval: true
  use_bm25: true
  use_hybrid_fusion: true
  use_reranker: false
  use_fact_routing: false
  use_compatibility_filter: false
  use_claim_repair: false

# Retrieval Parameters
retrieval:
  top_k: 5
  initial_k: 20
  embedding_model: "BAAI/bge-small-en-v1.5"
  bm25_k1: 1.5
  bm25_b: 0.75
  fusion_method: "RRF"
  rrf_constant_k: 60
  statute_purity_boost: 0.0

# LLM Generation Parameters
llm:
  model: "google-gemini"
  temperature: 0.0
  max_output_tokens: 1024
  random_seed: 42
  fallback_allowed: true

# Benchmark & Execution
benchmark:
  file: "evaluation/development/existing_questions.json"
  eval_retrieval_metrics: true
  eval_generation_metrics: true
